<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: the game only runs its own scripts, never code from anywhere else
      (family versions and share links are plain data). Inline styles are allowed because Phaser
      positions the Creator's text boxes with them; styles cannot run code.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Pixel Tower Defence</title>
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower Defence" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span>&#8635;</span>TURN YOUR<br />PHONE SIDEWAYS</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
